# Config for notebook 3

# Set to true for development (enables manifest validation + cleanup)
dev_mode: false

# Set to true to drop the catalog after setup (requires dev_mode: true)
resource_cleanup: false

# Set to true if this course uses the Medallion Lab pattern
medallion_lab: false

course_name: "Building Single Agent Applications on Databricks"
serverless_compute_version: "6"

catalog:
  prefix: "labuser"
  schema_name: "agent_training"

model_service:
  service_name: "agent-training-model"
  served_by: "databricks-gpt-5-2"
  comment: "Routes to databricks-gpt-5-2 for agent training"

data:
  databricks_share_name: "databricks_airbnb_sample_data"
  table_name: "sf_airbnb_listings"
  vocareum_share_name: "airbnb"

python_tools:
  - est_listing_value

libraries:
  groups:
    - pyyaml
    - unitycatalog-ai-databricks
    - databricks-mcp
    - databricks-sdk
    - databricks-openai
    - openai
    - nest-asyncio
    - mcp
