[project]
name = "simple-chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.6.0",
    "mcp<2",
   "databricks-openai==0.15.0",
    "databricks-sdk==0.108.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv",
    "uv",
    "databricks-vectorsearch==0.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agent.py", "server.py"]

[project.scripts]
start-server = "server:main"